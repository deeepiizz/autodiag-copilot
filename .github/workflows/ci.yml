name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Retrieval regression check (dev + held-out)
        run: python eval/run_eval.py --check
      - name: Answer-quality regression check (offline agent)
        run: python eval/judge.py --check
      - name: Logs are reproducible from the generator
        run: python scripts/generate_demo_logs.py && git diff --exit-code knowledge_base/logs
